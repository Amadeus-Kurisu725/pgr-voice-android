name: Weekly upstream sync

on:
  schedule:
    - cron: '23 1 * * 1' # Monday 09:23 Asia/Taipei
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weekly-upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Merge upstream without rewriting history
        shell: bash
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/abc85713344/pgr-voice-android.git
          git fetch --no-tags upstream main
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "Already includes upstream/main"
            exit 0
          fi
          if ! git merge-base HEAD upstream/main >/dev/null; then
            echo "::error::Unrelated histories; manual review required"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git merge --no-ff --no-edit upstream/main
          git push origin HEAD:main
